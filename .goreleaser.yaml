version: 2

project_name: pokego

builds:
  - env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=false
    # main.go declares `version`; release builds override it here.
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    goos:
      - linux
      - windows
      - darwin

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE

aurs:
  - name: pokego-bin
    homepage: https://github.com/rubiin/pokego
    description: A fast, Go rewrite of [phoney badger's pokemon-colorscripts](https://gitlab.com/phoneybadger/pokemon-colorscripts) that prints Pokémon sprites in color directly in your terminal.
    license: GPL-3.0-only
    maintainers:
      - "rubiin <roobin.bhandari@gmail.com>"
    git_url: ssh://aur@aur.archlinux.org/pokego-bin.git
    private_key: "{{ .Env.AUR_KEY }}"
    provides:
      - pokego
    conflicts:
      - pokego
      - pokego-git
    package: |-
      # bin
      install -Dm755 "./pokego" "${pkgdir}/usr/bin/pokego"
      # license
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/pokego/LICENSE"
      # completions (generated at package time from the shipped binary)
      ./pokego completion bash > pokego.bash
      ./pokego completion zsh > _pokego
      ./pokego completion fish > pokego.fish
      install -Dm644 "pokego.bash" "${pkgdir}/usr/share/bash-completion/completions/pokego"
      install -Dm644 "_pokego" "${pkgdir}/usr/share/zsh/site-functions/_pokego"
      install -Dm644 "pokego.fish" "${pkgdir}/usr/share/fish/vendor_completions.d/pokego.fish"


nfpms:
  - package_name: pokego
    file_name_template: '{{ .ConventionalFileName }}'
    homepage: https://github.com/rubiin/pokego
    description: A fast, Go rewrite of [phoney badger's pokemon-colorscripts](https://gitlab.com/phoneybadger/pokemon-colorscripts) that prints Pokémon sprites in color directly in your terminal.
    license: GPL-3.0-only
    maintainer: rubiin <roobin.bhandari@gmail.com>
    formats:
      - apk
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: ./LICENSE
        dst: /usr/share/licenses/pokego/LICENSE

changelog:
  sort: desc
  use: git

  groups:
    - title: 🚀 New Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: '^.*?(fix|bug)(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999



release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
